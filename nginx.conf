# Browser yang mengirim "Accept: image/webp" dapat <file>.png.webp kalau ada (dibuat saat build).
map $http_accept $webp_suffix {
    default "";
    "~*image/webp" ".webp";
}

# Gambar ber-hash Vite di-cache lama; gambar public/ tanpa hash tetap no-cache supaya penggantian tidak basi.
map $uri $image_cache {
    default "no-cache";
    "~^/assets/.+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location ~* \.(png|jpe?g)$ {
        add_header Vary Accept;
        add_header Cache-Control $image_cache;
        try_files $uri$webp_suffix $uri =404;
    }

    # Hanya file ber-hash hasil Vite yang di-cache lama; file public/ tanpa hash ikut aturan default.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
